[project]
name = "decoding-101"
version = "0.1.0"
description = "Decoding 101: your model already knows the answer, the sampler decides what it says"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Dmytro Iakubovskyi" }]
keywords = [
    "decoding",
    "sampling",
    "temperature",
    "top-k",
    "nucleus-sampling",
    "beam-search",
    "language-models",
]
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.14",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "streamlit>=1.38",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "ty>=0.0.1a7",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbclient>=0.10",
]

[project.urls]
Homepage = "https://github.com/Dima806/decoding_101"
Repository = "https://github.com/Dima806/decoding_101"

# ---------------------------------------------------------------------------
# Build: the import package is literally `src` (notebooks do `from src.decoders
# import ...`). Installing it editable makes that work from any working
# directory, which matters because nbconvert runs each notebook with its own
# directory as the cwd.
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# CPU-only torch. On PyPI the default linux/windows torch wheel drags in the
# CUDA runtime (several GB of nvidia-* packages), which breaks the 2-CPU / 8 GB
# Codespace budget and contradicts the no-GPU constraint. macOS wheels on PyPI
# are already CPU-only, so they stay on the default index.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "A", "SIM", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: takes more than a few seconds (model load, long generation)",
    "network: needs the HuggingFace Hub; skipped when HF_HUB_OFFLINE=1",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
